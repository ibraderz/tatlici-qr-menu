<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Çetin Usta - Tatlıcılar Baklava </title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --text-main: #f5f5f7;
      --text-muted: #a1a1a6;
      --accent: #d4af37;
      --badge-out: #ff453a;
      --border: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px 14px 60px; max-width: 600px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase; }
    header .subtitle { font-size: 0.85rem; color: #fff; font-weight: 600; margin-top: 2px; }
    header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .category-title { font-size: 1.15rem; margin: 24px 0 12px; color: var(--accent); border-left: 3px solid var(--accent); padding-left: 8px; font-weight: 700; }
    
    .item-card { 
      background: var(--card-bg); 
      border-radius: 14px; 
      padding: 12px; 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border: 1px solid var(--border); 
      gap: 12px;
    }

    .item-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 70px; }
    .item-name { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
    
    .price-box { margin-top: 8px; font-size: 0.85rem; }
    .price-tag { color: var(--accent); font-weight: 700; margin-right: 10px; }
    .price-label { color: var(--text-muted); font-size: 0.75rem; margin-right: 3px; }

    .item-image-wrapper {
      position: relative;
      width: 75px;
      height: 75px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #2a2a2c;
    }
    .item-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .sold-out { opacity: 0.45; }
    .sold-out-badge {
      display: inline-block;
      background: var(--badge-out);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }

    footer { text-align: center; margin-top: 30px; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>Tatlıcılar Baklava 1908</h1>
    <div class="subtitle">ÇETİN USTA</div>
    <p>Yüzyıllık Tecrübe</p>
  </header>

  <main id="menu-container"></main>

  <footer>
    <p>* Alerjiniz varsa lütfen ekipten bilgi almayı unutmayın.</p>
    <p style="margin-top:4px;">@tatlicilarcetinusta</p>
  </footer>

  <script>
    const menuData = [
      {
        "category": "Baklavalar",
        "items": [
          { "id": 1, "name": "Fıstıklı Mekik Baklava", "price_portion": "120 ₺", "price_kilo": "800 ₺", "image": "images/fistikli-mekik-baklava.jpg", "available": true },
          { "id": 2, "name": "Fıstıklı Kare Baklava", "price_portion": "150 ₺", "price_kilo": "1000 ₺", "image": "images/kare.png", "available": true },
          { "id": 3, "name": "Havuç Dilimi", "price_portion": "450 ₺", "price_kilo": "1000 ₺", "image": "images/havuc.png", "available": true },
          { "id": 4, "name": "Sultan", "price_portion": "150 ₺", "price_kilo": "1000 ₺", "image": "images/sultan.png", "available": true },
          { "id": 5, "name": "Bülbül Yuvası", "price_portion": "100 ₺", "price_kilo": "450 ₺", "image": "images/bulbul.png", "available": true },
          { "id": 6, "name": "Cevizli Baklava", "price_portion": "100 ₺", "price_kilo": "450 ₺", "image": "images/cevizli.png", "available": true },
          { "id": 7, "name": "Şöbiyet", "price_portion": "150 ₺", "price_kilo": "1000 ₺", "image": "images/sobiyet.jpg", "available": true },
          { "id": 8, "name": "Fıstık Sarma", "price_portion": "150 ₺", "price_kilo": "1000 ₺", "image": "images/midye.png", "available": true },
          { "id": 9, "name": "Soğuk Baklava", "price_portion": "100 ₺", "price_kilo": "900 ₺", "image": "images/soguk-baklava.jpg", "available": true }
        ]
      },
      {
        "category": "Künefe ve Katmer",
        "items": [
          { "id": 11, "name": "Cennet Çamuru", "price_portion": "200 ₺", "price_kilo": "800 ₺", "image": "images/cennet-camuru.jpg", "available": true },
          { "id": 12, "name": "Kilis Katmeri", "price_portion": "200 ₺", "price_kilo": "", "image": "images/kilis-katmeri.jpg", "available": true },
          { "id": 13, "name": "Simit Katmer", "price_portion": "350 ₺", "price_kilo": "", "image": "images/simit-katmer.jpg", "available": true },
          { "id": 14, "name": "Muska Katmer", "price_portion": "250 ₺", "price_kilo": "", "image": "images/muska-katmer.jpg", "available": true },
          { "id": 15, "name": "Peynirli Künefe", "price_portion": "100 ₺", "price_kilo": "400 ₺", "image": "images/peynirli-kunefe.jpg", "available": true },
          { "id": 16, "name": "Fıstıklı Künefe", "price_portion": "200 ₺", "price_kilo": "800 ₺", "image": "images/fistikli-kunefe.jpg", "available": true },
          { "id": 17, "name": "Fıstıklı Burma Kadayıf", "price_portion": "160 ₺", "price_kilo": "160 ₺", "image": "images/fistikli-burma-kadayif.jpg", "available": true }
        ]
      },
      {
        "category": "Kurabiye ve Gerebiç",
        "items": [
          { "id": 18, "name": "Fıstıklı Gerebiç", "price_kilo": "1400 ₺", "image": "images/fistikli-gerebic.jpg", "available": true },
          { "id": 19, "name": "Cevizli Gerebiç", "price_kilo": "700 ₺", "image": "images/cevizli-gerebic.jpg", "available": true },
          { "id": 20, "name": "İrmik Kurabiyesi", "price_kilo": "400 ₺", "image": "images/irmik-kurabiyesi.jpg", "available": true },
          { "id": 21, "name": "Fıstıklı İrmik Kurabiyesi", "price_kilo": "800 ₺", "image": "images/fistikli-irmik-kurabiyesi.jpg", "available": true }
        ]
      },
      {
        "category": "Dondurmalar",
        "items": [
          { "id": 22, "name": "Sade / Meyveli Dondurma", "price_portion": "60 ₺", "price_kilo": "400 ₺", "image": "images/sade-meyveli-dondurma.jpg", "available": true },
          { "id": 23, "name": "Fıstıklı Dondurma", "price_portion": "150 ₺", "price_kilo": "1200 ₺", "image": "images/fistikli-dondurma.jpg", "available": true }
        ]
      },
      {
        "category": "İçecekler",
        "items": [
          { "id": 24, "name": "Kutu İçecekler", "price_single": "55 ₺", "image": "images/kutu-icecekler.jpg", "available": true },
          { "id": 25, "name": "Meyveli Soda", "price_single": "25 ₺", "image": "images/meyveli-soda.jpg", "available": true },
          { "id": 26, "name": "Sade Soda", "price_single": "20 ₺", "image": "images/sade-soda.jpg", "available": true },
          { "id": 27, "name": "Su", "price_single": "15 ₺", "image": "images/su.jpg", "available": true },
          { "id": 28, "name": "Kola / Fanta (1L)", "price_single": "70 ₺", "image": "images/kola-fanta-1l.jpg", "available": true },
          { "id": 29, "name": "Kola (2.5L)", "price_single": "100 ₺", "image": "images/kola-25l.jpg", "available": true }
        ]
      }
    ];

    const container = document.getElementById('menu-container');

    menuData.forEach(group => {
      const section = document.createElement('div');
      section.innerHTML = `<h2 class="category-title">${group.category}</h2>`;

      group.items.forEach(item => {
        const isOut = !item.available;
        const card = document.createElement('div');
        card.className = `item-card ${isOut ? 'sold-out' : ''}`;
        
        let priceHtml = '';
        if (item.price_single) {
          priceHtml = `<span class="price-tag">${item.price_single}</span>`;
        } else {
          if (item.price_portion) priceHtml += `<span class="price-label">Porsiyon:</span><span class="price-tag">${item.price_portion}</span>`;
          if (item.price_kilo) priceHtml += `<span class="price-label">Kilo:</span><span class="price-tag">${item.price_kilo}</span>`;
        }

        const imageHtml = item.image ? `
          <div class="item-image-wrapper">
            <img src="${item.image}" alt="${item.name}" class="item-img" loading="lazy" onerror="this.parentElement.style.display='none'">
          </div>
        ` : '';

        card.innerHTML = `
          <div class="item-info">
            <div class="item-name">
              ${item.name}
              ${isOut ? '<span class="sold-out-badge">TÜKENDİ</span>' : ''}
            </div>
            <div class="price-box">${priceHtml}</div>
          </div>
          ${imageHtml}
        `;
        section.appendChild(card);
      });

      container.appendChild(section);
    });
  </script>
</body>
</html>
