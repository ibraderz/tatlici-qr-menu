<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tatlıcılar Baklava 1908 - Çetin Usta dijital QR menüsü. Baklava, künefe, katmer, kurabiye ve içecekler.">
  <title>Tatlıcılar Baklava 1908 - Çetin Usta Dijital QR Menü</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Lora:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-green: #0f4c3a;
      --accent-gold: #c9a227;
      --bg-cream: #f8f2e8;
      --text-dark: #1e1e1e;
      --text-muted: #666d75;
      --card-bg: #ffffff;
      --border-soft: rgba(201, 162, 39, 0.25);
      --badge-out: #d9383a;
      --shadow-soft: rgba(15, 76, 58, 0.08);
      --shadow-strong: rgba(15, 76, 58, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-cream);
      background-image: radial-gradient(circle at top, #ffffff 0%, #f8f2e8 100%);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 16px 14px 60px;
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    input {
      font: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      position: relative;
    }

    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--primary-green) 100%);
      padding: 3px;
      box-shadow: 0 6px 20px rgba(15, 76, 58, 0.15);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      background-color: var(--bg-cream);
      display: block;
    }

    header h1 {
      font-family: 'Lora', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--primary-green);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-year {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--accent-gold);
      font-size: 1.1rem;
      font-weight: 600;
      margin: 2px 0;
    }

    header .subtitle {
      font-family: 'Cormorant SC', serif;
      font-size: 1.15rem;
      color: var(--primary-green);
      font-weight: 700;
      letter-spacing: 2px;
    }

    header .tagline {
      font-family: 'Cormorant SC', serif;
      font-size: 0.8rem;
      color: var(--accent-gold);
      margin-top: 4px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      margin: 14px auto 0;
      width: 70%;
      opacity: 0.6;
    }

    .controls-wrapper {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(248, 242, 232, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 0;
      margin-bottom: 16px;
      border-radius: 12px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      width: 100%;
      padding: 10px 14px;
      border-radius: 25px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      font-size: 0.85rem;
      color: var(--text-dark);
      outline: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.12);
    }

    .clear-search {
      border: 1px solid var(--border-soft);
      background: var(--card-bg);
      color: var(--primary-green);
      border-radius: 999px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.2s ease;
      flex-shrink: 0;
    }

    .clear-search:hover {
      background: var(--bg-cream);
    }

    .clear-search:active {
      transform: scale(0.96);
    }

    .category-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      color: var(--primary-green);
      font-family: 'Cormorant SC', serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary-green);
      color: var(--bg-cream);
      border-color: var(--primary-green);
    }

    .tab-btn:hover {
      border-color: var(--accent-gold);
    }

    .category-title {
      font-family: 'Lora', serif;
      font-size: 1.2rem;
      margin: 24px 0 12px;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--accent-gold), transparent);
    }

    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(201, 162, 39, 0.2);
      gap: 12px;
      box-shadow: 0 4px 12px var(--shadow-soft);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      position: relative;
    }

    .item-card:active {
      transform: scale(0.99);
    }

    .item-card:hover {
      box-shadow: 0 6px 16px var(--shadow-soft);
    }

    .item-card.selected {
      border-color: var(--primary-green);
      box-shadow: 0 8px 22px rgba(15, 76, 58, 0.12);
    }

    .item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 70px;
    }

    .item-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .price-box {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .price-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-cream);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-soft);
    }

    .price-label {
      font-family: 'Cormorant SC', serif;
      color: var(--primary-green);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .price-tag {
      color: var(--accent-gold);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .item-image-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--accent-gold);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, width 0.2s ease, height 0.2s ease;
      transform-origin: center center;
      background: var(--bg-cream);
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .item-card:hover .item-image-wrapper,
    .item-card:focus-within .item-image-wrapper {
      transform: scale(1.12);
      box-shadow: 0 10px 18px var(--shadow-strong);
      border-color: var(--primary-green);
      z-index: 2;
    }

    .item-card:hover .item-img,
    .item-card:focus-within .item-img {
      transform: scale(1.08);
    }

    .item-card.selected .item-image-wrapper {
      width: 110px;
      height: 110px;
      transform: scale(1.14);
      z-index: 2;
      box-shadow: 0 12px 22px var(--shadow-strong);
      border-color: var(--primary-green);
    }

    .item-card.selected .item-img {
      transform: scale(1.12);
    }

    .sold-out {
      opacity: 0.5;
      filter: grayscale(80%);
    }

    .sold-out-badge {
      display: inline-block;
      background: var(--badge-out);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      font-family: 'Cormorant SC', serif;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-soft);
      padding-top: 16px;
    }

    @media (max-width: 360px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .item-card {
        gap: 8px;
        padding: 10px;
      }

      .item-image-wrapper {
        width: 68px;
        height: 68px;
      }

      .item-card.selected .item-image-wrapper {
        width: 88px;
        height: 88px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/logo.png" alt="Tatlıcılar Baklava Logo" class="logo-img" onerror="this.src='https://placehold.co/100x100/0f4c3a/c9a227?text=ÇETİN+USTA'">
    </div>
    <h1>Tatlıcılar Baklava</h1>
    <div class="header-year">1908</div>
    <div class="subtitle">ÇETİN USTA</div>
    <div class="tagline">Yüzyıllık Tecrübe</div>
    <div class="divider"></div>
  </header>

  <div class="controls-wrapper">
    <div class="search-row">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Ürün ara... (ör. Baklava, Katmer, Dondurma)"
        aria-label="Ürün ara"
        autocomplete="off"
      >
      <button type="button" id="clear-search" class="clear-search" aria-label="Arama alanını temizle">×</button>
    </div>

    <div class="category-tabs" id="category-tabs" aria-label="Ürün kategorileri">
      <button class="tab-btn active" type="button" data-category="ALL">Tümü</button>
      <button class="tab-btn" type="button" data-category="Baklavalar">Baklavalar</button>
      <button class="tab-btn" type="button" data-category="Künefe ve Katmer">Künefe &amp; Katmer</button>
      <button class="tab-btn" type="button" data-category="Kurabiye ve Gerebiç">Kurabiye &amp; Gerebiç</button>
      <button class="tab-btn" type="button" data-category="Dondurmalar">Dondurmalar</button>
      <button class="tab-btn" type="button" data-category="İçecekler">İçecekler</button>
    </div>
  </div>

  <main id="menu-container" aria-live="polite" aria-atomic="true"></main>

  <footer>
    <div class="instagram-handle">@tatlicilarcetinusta</div>
  </footer>

  <script>
    const menuData = [
      {
        category: 'Baklavalar',
        items: [
          { id: 1, name: 'Fıstıklı Mekik Baklava', price_portion: '120 ₺', price_kilo: '800 ₺', image: 'images/midye.png', available: true },
          { id: 2, name: 'Fıstıklı Kare Baklava', price_portion: '150 ₺', price_kilo: '1000 ₺', image: 'images/kare.png', available: true },
          { id: 3, name: 'Havuç Dilimi', price_portion: '450 ₺', price_kilo: '1000 ₺', image: 'images/havuc.png', available: true },
          { id: 4, name: 'Sultan', price_portion: '150 ₺', price_kilo: '1000 ₺', image: 'images/sultan.png', available: true },
          { id: 5, name: 'Bülbül Yuvası', price_portion: '100 ₺', price_kilo: '450 ₺', image: 'images/bulbul.png', available: true },
          { id: 6, name: 'Cevizli Baklava', price_portion: '100 ₺', price_kilo: '450 ₺', image: 'images/cevizli.png', available: true },
          { id: 7, name: 'Şöbiyet', price_portion: '150 ₺', price_kilo: '1000 ₺', image: 'images/sobiyet.png', available: false },
          { id: 8, name: 'Midye', price_portion: '150 ₺', price_kilo: '1000 ₺', image: 'images/midye.png', available: true },
          { id: 9, name: 'Soğuk Baklava', price_portion: '100 ₺', price_kilo: '900 ₺', image: 'images/soguk-baklava.png', available: false },
          { id: 10, name: 'Kuru Baklava', price_portion: '450 ₺', price_kilo: '450 ₺', image: 'images/kuru-baklava.png', available: false }
        ]
      },
      {
        category: 'Künefe ve Katmer',
        items: [
          { id: 11, name: 'Cennet Çamuru', price_portion: '200 ₺', price_kilo: '800 ₺', image: 'images/camur.png', available: true },
          { id: 12, name: 'Kilis Katmeri', price_portion: '200 ₺', price_kilo: '', image: 'images/katmer.png', available: true },
          { id: 13, name: 'Simit Katmer', price_portion: '350 ₺', price_kilo: '', image: 'images/simit-katmer.png', available: false },
          { id: 14, name: 'Muska Katmer', price_portion: '250 ₺', price_kilo: '', image: 'images/muska-katmer.png', available: false },
          { id: 15, name: 'Peynirli Künefe', price_portion: '100 ₺', price_kilo: '400 ₺', image: 'images/peynirli-kunefe.png', available: true },
          { id: 16, name: 'Fıstıklı Künefe', price_portion: '200 ₺', price_kilo: '800 ₺', image: 'images/fistikli-kunefe.png', available: true },
          { id: 17, name: 'Fıstıklı Burma Kadayıf', price_portion: '160 ₺', price_kilo: '160 ₺', image: 'images/burma-kadayif.png', available: false }
        ]
      },
      {
        category: 'Kurabiye ve Gerebiç',
        items: [
          { id: 18, name: 'Fıstıklı Gerebiç', price_kilo: '1400 ₺', image: 'images/fistikli-gerebic.png', available: true },
          { id: 19, name: 'Cevizli Gerebiç', price_kilo: '700 ₺', image: 'images/cevizli-gerebic.png', available: true },
          { id: 20, name: 'İrmik Kurabiyesi', price_kilo: '400 ₺', image: 'images/irmik-kurabiyesi.png', available: true },
          { id: 21, name: 'Fıstıklı İrmik Kurabiyesi', price_kilo: '800 ₺', image: 'images/fistikli-irmik-kurabiyesi.png', available: true }
        ]
      },
      {
        category: 'Dondurmalar',
        items: [
          { id: 22, name: 'Sade / Meyveli Dondurma', price_portion: '60 ₺', price_kilo: '400 ₺', image: 'images/sade-dondurma.png', available: true },
          { id: 23, name: 'Fıstıklı Dondurma', price_portion: '150 ₺', price_kilo: '1200 ₺', image: 'images/fistikli-dondurma.png', available: true }
        ]
      },
      {
        category: 'İçecekler',
        items: [
          { id: 24, name: 'Kutu İçecekler', price_single: '60 ₺', image: 'images/kutu-icecekler.png', available: true },
          { id: 25, name: 'Meyveli Soda', price_single: '25 ₺', image: 'images/meyveli-soda.png', available: true },
          { id: 26, name: 'Sade Soda', price_single: '20 ₺', image: 'images/sade-soda.png', available: true },
          { id: 27, name: 'Su', price_single: '10 ₺', image: 'images/su.png', available: true },
          { id: 28, name: 'Kola / Fanta (1L)', price_single: '70 ₺', image: 'images/kola-1l.png', available: true },
          { id: 29, name: 'Kola (2.5L)', price_single: '100 ₺', image: 'images/kola-2l.png', available: true }
        ]
      }
    ];

    let activeCat = 'ALL';
    let searchQuery = '';
    let selectedItemId = null;

    function normalizeText(value = '') {
      return value
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function filteredItemsForGroup(group) {
      return group.items.filter(item => {
        const haystack = normalizeText(`${item.name} ${group.category}`);
        return haystack.includes(normalizeText(searchQuery));
      });
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const visibleGroups = menuData.filter(group => {
        const categoryMatches = activeCat === 'ALL' || group.category === activeCat;
        return categoryMatches && filteredItemsForGroup(group).length > 0;
      });

      if (!visibleGroups.length) {
        container.innerHTML = '<p class="empty-state">Aramanıza uygun ürün bulunamadı.</p>';
        return;
      }

      visibleGroups.forEach(group => {
        const section = document.createElement('div');
        section.innerHTML = `<h2 class="category-title">${group.category}</h2>`;

        filteredItemsForGroup(group).forEach(item => {
          const isOut = !item.available;
          const isSelected = Number(selectedItemId) === Number(item.id);
          const card = document.createElement('div');
          card.className = `item-card ${isOut ? 'sold-out' : ''} ${isSelected ? 'selected' : ''}`;
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `${item.name} ${isSelected ? 'seçili' : 'seçim için'}`);

          const handleSelect = () => {
            selectedItemId = Number(item.id);
            renderMenu();
          };

          card.addEventListener('click', handleSelect);
          card.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              handleSelect();
            }
          });

          let priceHtml = '';

          if (item.price_single) {
            priceHtml = `
              <div class="price-badge">
                <span class="price-tag">${item.price_single}</span>
              </div>`;
          } else {
            if (item.price_portion) {
              priceHtml += `
                <div class="price-badge">
                  <span class="price-label">Por:</span>
                  <span class="price-tag">${item.price_portion}</span>
                </div>`;
            }
            if (item.price_kilo) {
              priceHtml += `
                <div class="price-badge">
                  <span class="price-label">Kg:</span>
                  <span class="price-tag">${item.price_kilo}</span>
                </div>`;
            }
          }

          const imageHtml = item.image ? `
            <div class="item-image-wrapper">
              <img src="${item.image}" alt="${item.name}" class="item-img" loading="lazy" decoding="async" onerror="this.parentElement.style.display='none'">
            </div>
          ` : '';

          card.innerHTML = `
            <div class="item-info">
              <div class="item-name">
                ${item.name}
                ${isOut ? '<span class="sold-out-badge">TÜKENDİ</span>' : ''}
              </div>
              <div class="price-box">${priceHtml}</div>
            </div>
            ${imageHtml}
          `;

          section.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    function filterCategory(cat, button) {
      activeCat = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderMenu();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('clear-search');

      document.querySelectorAll('.tab-btn').forEach(button => {
        button.addEventListener('click', () => filterCategory(button.dataset.category, button));
      });

      searchInput.addEventListener('input', (event) => {
        searchQuery = event.target.value.trim();
        renderMenu();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchQuery = '';
        searchInput.value = '';
        renderMenu();
        searchInput.focus();
      });

      renderMenu();
    });
  </script>
</body>
</html>
